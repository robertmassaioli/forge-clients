name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Reads version from "packageManager" field in package.json (pnpm@9.x)

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm -r run typecheck

      - name: Run tests
        # Tests resolve workspace packages via vitest aliases to source — no build needed
        run: pnpm test

      - name: Build all packages
        # Build after tests to verify all packages produce clean dist/ output
        run: pnpm -r run build
