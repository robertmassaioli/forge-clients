name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/*/src/**/*.ts'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No 'version' key here — pnpm/action-setup@v4 automatically reads the
        # version from the "packageManager" field in package.json (pnpm@9.0.0).
        # Specifying both causes ERR_PNPM_BAD_PM_VERSION.

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # --frozen-lockfile ensures CI uses exactly what is in pnpm-lock.yaml.
        # The lockfile was generated with registry.npmjs.org (see .npmrc) and
        # contains no private registry URLs. If it ever gets regenerated with
        # Atlassian corporate registry URLs, delete node_modules and regenerate
        # per the instructions in .npmrc.
        run: pnpm install --frozen-lockfile

      - name: Build @forge-clients packages (needed for API reference generation)
        run: pnpm --filter @forge-clients/core --filter @forge-clients/jira --filter @forge-clients/confluence run build

      - name: Build documentation site
        run: pnpm --filter @forge-clients/docs run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
