name: Release

# Trigger options:
# 1. Push a version tag: git tag v0.2.0 && git push origin v0.2.0
# 2. Manual dispatch from the GitHub Actions UI (useful for first publish or reruns)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false  # Never cancel an in-flight publish

jobs:
  release:
    name: Build, Test & Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Needed for changeset to push version bump commits/tags

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required for changeset to determine what changed
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        # Reads pnpm version from "packageManager" field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          # Configures ~/.npmrc with NODE_AUTH_TOKEN for publishing.
          # Must match the registry in .npmrc (registry.npmjs.org).
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all packages
        run: pnpm -r run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build all packages
        run: pnpm -r run build

      - name: Publish to npm
        # changeset publish finds all packages whose version is not yet on npm
        # and publishes them. Safe to rerun — already-published versions are skipped.
        run: pnpm changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
